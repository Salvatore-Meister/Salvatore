<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lager-Predictor & Energy Tracker</title>
    <!-- Tailwind CSS für High-End Mobile Design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full bg-slate-900 rounded-3xl shadow-2xl p-6 border border-slate-800">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-amber-400 tracking-wider">LAGER-PREDICTOR</h1>
            <p class="text-xs text-slate-400 mt-1">Dein 30-Sekunden Schicht-Log & Prämien-Coach</p>
        </div>

        <!-- Formular -->
        <form id="trackingForm" class="space-y-4">
            <!-- Datum -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Datum</label>
                <input type="date" id="datum" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400" required>
            </div>

            <!-- Zone -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Zone</label>
                <select id="zone" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    <option value="Kommissionierung">Kommissionierung</option>
                    <option value="Tiefkühl (TK)">Tiefkühl (TK)</option>
                    <option value="Sonderzone (SD)">Sonderzone (SD)</option>
                </select>
            </div>

            <!-- Touren & Boxen -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Touren</label>
                    <input type="number" id="touren" placeholder="z.B. 12" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Boxen</label>
                    <input type="number" id="boxen" placeholder="z.B. 145" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400" required>
                </div>
            </div>

            <!-- Passive Zeit & Akku -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Passive Zeit (Min)</label>
                    <input type="number" id="passiveZeit" placeholder="z.B. 30" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Rest-Akku (1-5)</label>
                    <input type="number" id="akku" min="1" max="5" placeholder="1-5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400" required>
                </div>
            </div>

            <!-- Reibungspunkt -->
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Haupt-Reibungspunkt</label>
                <select id="reibung" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    <option value="Keine">Keine</option>
                    <option value="Orga-Chaos / Warten">Orga-Chaos / Warten</option>
                    <option value="Kälte (TK/SD)">Kälte (TK/SD)</option>
                    <option value="Körper / Rücken">Körper / Rücken</option>
                </select>
            </div>

            <!-- Absende-Button -->
            <button type="button" onclick="analysiereSchicht()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl transition uppercase tracking-wider text-sm mt-4 shadow-lg shadow-amber-500/20">
                Schicht auswerten & Benchmark holen
            </button>
        </form>

        <!-- Ergebnis / Feedback Box -->
        <div id="ergebnisBox" class="hidden mt-6 bg-slate-950 border border-amber-500/50 rounded-2xl p-4 text-sm space-y-3">
            <h3 class="font-bold text-amber-400 flex items-center gap-2">⚡ Live-Benchmark & Analyse</h3>
            <p id="feedbackText" class="text-slate-300 text-xs leading-relaxed"></p>
            
            <!-- Export / Kopieren Button -->
            <button type="button" onclick="kopiereErgebnis()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2.5 rounded-xl transition text-xs border border-slate-700">
                📋 Log für Notizen kopieren
            </button>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-600 mt-6">
        Lager-Predictor v1.0 • DSGVO Konform & Privat
    </footer>

    <script>
        // Setze heutiges Datum automatisch
        document.getElementById('datum').valueAsDate = new Date();

        let letzterText = "";

        function analysiereSchicht() {
            const datum = document.getElementById('datum').value;
            const zone = document.getElementById('zone').value;
            const touren = parseInt(document.getElementById('touren').value) || 0;
            const boxen = parseInt(document.getElementById('boxen').value) || 0;
            const passiveZeit = parseInt(document.getElementById('passiveZeit').value) || 0;
            const akku = parseInt(document.getElementById('akku').value) || 3;
            const reibung = document.getElementById('reibung').value;

            // Benchmark-Ziel (Beispiel)
            const zielTouren = 14;
            const zielBoxen = 160;
            
            let feedback = `<strong>Datum:</strong> ${datum}<br>`;
            feedback += `<strong>Zone:</strong> ${zone}<br>`;
            feedback += `• Leistung: ${touren} Touren, ${boxen} Boxen<br>`;
            feedback += `• Passive Zeit: ${passiveZeit} Min | Akku: ${akku}/5<br>`;
            feedback += `• Reibung: ${reibung}<br><br>`;

            if (touren >= zielTouren && boxen >= zielBoxen) {
                feedback += `🏆 <span class="text-emerald-400 font-bold">Starker Job!</span> Zielmarke für Prämie geknackt.`;
            } else {
                const diffTouren = zielTouren - touren;
                const diffBoxen = zielBoxen - boxen;
                feedback += `🎯 <span class="text-amber-400 font-bold">Prämien-Hebel:</span> ${diffTouren > 0 ? diffTouren + ' Touren ' : ''}${diffBoxen > 0 ? '& ' + diffBoxen + ' Boxen fehlen' : ''}. Tipp: Wartezeiten senken!`;
            }

            letzterText = `[Schicht-Log ${datum}]\nZone: ${zone}\nTouren: ${touren} | Boxen: ${boxen}\nPassive Zeit: ${passiveZeit} Min\nAkku: ${akku}/5\nReibung: ${reibung}`;

            document.getElementById('ergebnisBox').classList.remove('hidden');
            document.getElementById('feedbackText').innerHTML = feedback;
        }

        function kopiereErgebnis() {
            navigator.clipboard.writeText(letzterText).then(() => {
                alert("Log in die Zwischenablage kopiert! Du kannst es jetzt in deinen Notizen einfügen.");
            });
        }
    </script>
</body>
</html>
